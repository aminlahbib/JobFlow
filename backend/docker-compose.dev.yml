version: '3.8'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobflow-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobflow-celery-worker
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      - api
      - postgres
      - redis
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--queues=scraping,ai,notifications"]

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobflow-celery-beat
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      - api
      - postgres
      - redis
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]

# Include base services
include:
  - docker-compose.yml

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jobflow-postgres
    environment:
      POSTGRES_DB: jobflow
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: jobflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobflow -d jobflow"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    container_name: jobflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backend API (optional - for full containerization)
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: jobflow-backend
  #   environment:
  #     - POSTGRES_SERVER=postgres
  #     - POSTGRES_USER=jobflow
